services:
  - type: web
    name: tradeski-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      # Comma-separated allowed origins
      - key: ALLOWED_ORIGINS
        value: https://tradeski.dev,https://www.tradeski.dev,https://tradeski.onrender.com
      # Non-secret defaults — safe to commit
      - key: STOCK_SYMBOLS
        value: AAPL,MSFT,TSLA,NVDA,AMZN
      - key: CHECK_INTERVAL
        value: "60"
      # Secrets — set these in the Render dashboard after connecting the repo
      # Signs user auth tokens — REQUIRED, or sessions reset on every restart.
      - key: SECRET_KEY
        sync: false
      # Postgres (e.g. Neon) so accounts/portfolios survive redeploys. Without
      # it the app uses ephemeral SQLite and loses data on each redeploy/sleep.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: PUSHOVER_USER_KEY
        sync: false
      - key: PUSHOVER_API_TOKEN
        sync: false
